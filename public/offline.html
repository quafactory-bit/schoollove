<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FFFFFF">
    <title>오프라인 | 스쿨러브아이</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        width: 52px;
        height: 52px;
        place-items: center;
        margin-bottom: 20px;
        border-radius: 16px;
        background: #0a0a0a;
        color: #ffffff;
        font-size: 28px;
      }
      h1 { margin: 0; font-size: 24px; line-height: 1.35; }
      p { margin: 12px 0 24px; color: #4b5563; font-size: 15px; line-height: 1.7; }
      button {
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #0a0a0a;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #9ca3af; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">♥</div>
      <h1>인터넷 연결이 끊겼어요</h1>
      <p>연결되면 다시 시도해 주세요</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
